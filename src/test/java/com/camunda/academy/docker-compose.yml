services:
  camunda:
    image: camunda/camunda:8.8.16 # Or camunda/zeebe:8.6.0
    container_name: camunda-test-engine
    ports:
      - "8080:8080"   # REST (Standard for C7 and C8)
      - "26500:26500" # gRPC (Required for C8)-
      - "9600:9600" # Monitoring
    healthcheck:
      # This ensures the engine is actually ready before we start testing
      test: ["CMD", "curl", "-f", "http://localhost:8080/engine-rest/version"]
      interval: 5s
      timeout: 5s
      retries: 10